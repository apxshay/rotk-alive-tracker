# ROTK alive overlay settings. Numbers use a dot.
# Empty LogDir = read installation.root from %APPDATA%\ROTK Launcher\config.v1.json, else C:\Games\ROTK.
LogDir=
# Anchor: TopLeft, TopRight, BottomLeft, BottomRight. X and Y are fractions of the screen from that corner.
Anchor=TopLeft
X=0.841
Y=0.2156
# Sizes are fractions of the screen height.
FontScale=0.011
PanelWidthScale=0.2
MaxRows=15
# 1 = names in capitals like the game UI, 0 = as written in the kill feed.
UppercaseNames=1
StaleMinutes=5
# Whole panel, 0.15 to 1. Set it from Settings in the tray menu or in edit mode (Ctrl+Alt+P).
Opacity=0.46
# 1 = show the shortcut hint on the panel for a few seconds after start.
ShowHints=1
# Background only, on top of Opacity.
PanelOpacity=0.88
# Public ladder lookups. Region: eu, na, oce, au. Mode: solo, duos.
LadderRegion=eu
LadderMode=solo
